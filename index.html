<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 휴대폰 화면 크기에 맞추는 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생각한조각 링크나무</title>

  <script>
    /* ==========================================================
       ★★★ 여기만 고치면 됩니다 ★★★
       - 따옴표(" ") 안의 글자만 바꾸세요.
       - 버튼을 늘리려면 { ... }, 한 줄을 복사해서 아래에 붙여넣으세요.
       - 맨 앞에 // 가 붙은 줄은 "잠시 꺼둔 줄"입니다. // 를 지우면 버튼이 나타납니다.
       ========================================================== */

    // 프로필 정보
    var 프로필 = {
      이름: "생각한조각",
      소개: "AI로 만드는 짧은 이야기",
      사진: "channels4_profile.jpg"   // 이 폴더에 넣은 사진 파일 이름 (없으면 글자 동그라미가 대신 보입니다)
    };

    // 링크 버튼 목록 (위에서부터 순서대로 보입니다)
    var 링크목록 = [
      { 아이콘: "▶", 이름: "유튜브 채널", 주소: "https://www.youtube.com/@%EC%83%9D%EA%B0%81%ED%95%9C%EC%A1%B0%EA%B0%811" },
      { 아이콘: "☕", 이름: "네이버 카페", 주소: "https://cafe.naver.com/purpleofolr" },
      // { 아이콘: "📷", 이름: "인스타그램", 주소: "https://www.instagram.com/아이디" },
      // { 아이콘: "✉", 이름: "문의하기", 주소: "mailto:이메일주소@gmail.com" },
    ];

    /* ===================== 여기까지만 고치면 됩니다 ===================== */
  </script>

  <!-- 글씨체: 깔끔한 '프리텐다드' (인터넷이 없으면 컴퓨터 기본 글씨체로 보입니다) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <style>
    /* ---------- 색상 모음 (페이지의 '옷 색깔') ---------- */
    :root {
      --배경: #f5f3ef;        /* 아주 연한 웜 그레이 배경 */
      --배경빛: #e4ecf1;      /* 위쪽에 은은하게 퍼지는 하늘빛 (프로필 그림 색에서 따옴) */
      --글자: #23272a;        /* 거의 검정에 가까운 진한 글자 */
      --보조글자: #6b7378;    /* 소개 글 색 */
      --버튼: #ffffff;        /* 버튼 바탕 */
      --버튼테두리: #e6e2da;  /* 아주 옅은 테두리 */
      --강조: #2f3b43;        /* 차분한 먹색 (마우스 올렸을 때) */
    }

    /* ---------- 페이지 전체 ---------- */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      /* 위쪽만 살짝 하늘빛이 도는 배경 */
      background:
        radial-gradient(120% 60% at 50% 0%, var(--배경빛) 0%, rgba(228, 236, 241, 0) 70%),
        var(--배경);
      color: var(--글자);
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      font-size: 20px;          /* 기본 글씨를 크게 */
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* 가운데 정렬된 내용 (테두리 상자 없이 깔끔하게, 컴퓨터에서도 너무 넓어지지 않게) */
    .내용 {
      max-width: 440px;
      margin: 0 auto;
      padding: 64px 20px 56px;
      text-align: center;
    }

    /* ---------- 기능 1. 프로필 영역 ---------- */
    /* 동그란 사진 틀 */
    #사진자리 {
      width: 132px;
      height: 132px;
      border-radius: 50%;       /* 동그랗게 */
      margin: 0 auto;
      overflow: hidden;         /* 틀 밖으로 나간 부분은 숨김 */
      /* 사진 둘레에 흰 테 + 아주 옅은 바깥선 */
      box-shadow: 0 0 0 4px #ffffff, 0 0 0 5px var(--버튼테두리), 0 10px 30px rgba(35, 39, 42, 0.12);
    }

    .프로필사진 {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      /* 사진을 살짝 확대해서 얼굴이 가운데 크게 보이도록 (그림 아래 글자는 가려짐) */
      transform: scale(1.8);
      transform-origin: 50% 26%;
    }

    /* 사진이 없을 때 대신 보이는 글자 동그라미 */
    .대체사진 {
      width: 100%;
      height: 100%;
      background: var(--강조);
      color: #ffffff;
      font-size: 54px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .이름 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.02em;  /* 글자 사이를 살짝 좁혀 단정하게 */
      margin: 28px 0 6px;
    }

    .소개 {
      font-size: 19px;
      color: var(--보조글자);
      margin: 0 0 40px;
    }

    /* ---------- 기능 2. 링크 버튼 목록 ---------- */
    #버튼자리 {
      display: flex;
      flex-direction: column;
      gap: 14px;                 /* 버튼 사이 간격 */
    }

    .링크버튼 {
      /* 왼쪽 아이콘 | 가운데 버튼 이름 | 오른쪽 빈칸(좌우 균형용) */
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      min-height: 68px;          /* 손가락으로 누르기 쉬운 큰 버튼 */
      padding: 10px 12px;
      background: var(--버튼);
      color: var(--글자);
      border: 1px solid var(--버튼테두리);
      border-radius: 999px;      /* 알약처럼 둥근 모양 */
      box-shadow: 0 1px 2px rgba(35, 39, 42, 0.04);
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;     /* 밑줄 없애기 */
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .링크버튼::after { content: ""; }   /* 오른쪽 빈칸 */

    /* 아이콘을 작은 동그라미 안에 */
    .아이콘 {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--배경);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: background 0.2s;
    }

    /* 기능 4. 마우스를 올리거나 누르면 살짝 색이 변함 */
    .링크버튼:hover,
    .링크버튼:active,
    .링크버튼:focus-visible {
      background: var(--강조);
      border-color: var(--강조);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(35, 39, 42, 0.16);
      outline: none;
    }

    .링크버튼:hover .아이콘,
    .링크버튼:active .아이콘,
    .링크버튼:focus-visible .아이콘 {
      background: rgba(255, 255, 255, 0.14);
    }

    /* 휴대폰처럼 좁은 화면 */
    @media (max-width: 520px) {
      .내용 { padding: 48px 18px 40px; }
    }
  </style>
</head>
<body>
  <main class="내용">
    <!-- 프로필 영역 (사진 + 이름 + 소개) -->
    <div id="사진자리"></div>
    <h1 class="이름" id="이름"></h1>
    <p class="소개" id="소개"></p>

    <!-- 링크 버튼들이 여기에 자동으로 만들어집니다 -->
    <nav id="버튼자리"></nav>
  </main>

  <script>
    // 맨 위에 적어둔 정보를 화면에 채워 넣는 부분 (고칠 필요 없음)
    document.getElementById("이름").textContent = 프로필.이름;
    document.getElementById("소개").textContent = 프로필.소개;

    // 프로필 사진: 사진 파일이 없으면 이름 첫 글자 동그라미로 대신 보여줌
    var 사진자리 = document.getElementById("사진자리");
    var 사진 = document.createElement("img");
    사진.className = "프로필사진";
    사진.alt = 프로필.이름 + " 프로필 사진";
    사진.src = 프로필.사진;
    사진.onerror = function () {
      var 대체 = document.createElement("div");
      대체.className = "대체사진";
      대체.textContent = 프로필.이름.charAt(0);
      사진자리.replaceChildren(대체);
    };
    사진자리.appendChild(사진);

    // 링크 버튼 만들기 (누르면 새 탭으로 열림)
    var 버튼자리 = document.getElementById("버튼자리");
    링크목록.forEach(function (링크) {
      var 버튼 = document.createElement("a");
      버튼.className = "링크버튼";
      버튼.href = 링크.주소;
      버튼.target = "_blank";
      버튼.rel = "noopener";
      버튼.innerHTML = '<span class="아이콘"></span><span></span>';
      버튼.children[0].textContent = 링크.아이콘;
      버튼.children[1].textContent = 링크.이름;
      버튼자리.appendChild(버튼);
    });
  </script>
</body>
</html>
