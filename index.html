<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 휴대폰 화면 크기에 맞추는 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생각한조각 링크나무</title>

  <script>
    /* ==========================================================
       ★★★ 여기만 고치면 됩니다 ★★★
       - 따옴표(" ") 안의 글자만 바꾸세요.
       - 버튼을 늘리려면 { ... }, 한 줄을 복사해서 아래에 붙여넣으세요.
       - 맨 앞에 // 가 붙은 줄은 "잠시 꺼둔 줄"입니다. // 를 지우면 버튼이 나타납니다.
       ========================================================== */

    // 프로필 정보
    var 프로필 = {
      이름: "생각한조각",
      소개: "AI로 만드는 짧은 이야기",
      사진: "profile.jpg"   // 이 폴더에 넣은 사진 파일 이름 (없으면 글자 동그라미가 대신 보입니다)
    };

    // 링크 버튼 목록 (위에서부터 순서대로 보입니다)
    var 링크목록 = [
      { 아이콘: "▶", 이름: "유튜브 채널", 주소: "https://www.youtube.com/@%EC%83%9D%EA%B0%81%ED%95%9C%EC%A1%B0%EA%B0%811" },
      { 아이콘: "☕", 이름: "네이버 카페", 주소: "https://cafe.naver.com/purpleofolr" },
      // { 아이콘: "📷", 이름: "인스타그램", 주소: "https://www.instagram.com/아이디" },
      // { 아이콘: "✉", 이름: "문의하기", 주소: "mailto:이메일주소@gmail.com" },
    ];

    /* ===================== 여기까지만 고치면 됩니다 ===================== */
  </script>

  <style>
    /* ---------- 색상 모음 (페이지의 '옷 색깔') ---------- */
    :root {
      --배경: #f4f1ec;        /* 따뜻한 베이지 배경 */
      --글자: #2f3437;        /* 진한 회색 글자 */
      --보조글자: #5f6b70;    /* 소개 글 색 */
      --버튼: #ffffff;        /* 버튼 바탕 */
      --버튼테두리: #d6d0c4;
      --강조: #4a6b5d;        /* 차분한 초록 (마우스 올렸을 때) */
    }

    /* ---------- 페이지 전체 ---------- */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--배경);
      color: var(--글자);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      font-size: 20px;          /* 기본 글씨를 크게 */
      line-height: 1.5;
    }

    /* 가운데 정렬된 내용 상자 = 둥근 테두리 프레임 (컴퓨터에서도 너무 넓어지지 않게) */
    .내용 {
      max-width: 480px;
      margin: 24px auto;
      padding: 44px 28px 32px;
      text-align: center;
      background: #fbfaf7;                         /* 프레임 안쪽 바탕 */
      border: 2px solid var(--버튼테두리);         /* 프레임 테두리 선 */
      border-radius: 28px;                         /* 모서리를 둥글게 */
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);  /* 살짝 떠 보이는 그림자 */
    }

    /* 휴대폰처럼 좁은 화면에서는 프레임 바깥 여백을 조금 줄임 */
    @media (max-width: 520px) {
      .내용 {
        margin: 16px;
        padding: 36px 20px 24px;
      }
    }

    /* ---------- 기능 1. 프로필 영역 ---------- */
    .프로필사진 {
      width: 150px;
      height: 150px;
      border-radius: 50%;       /* 동그랗게 */
      object-fit: cover;
      border: 4px solid #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      display: block;
      margin: 0 auto;
    }

    /* 사진이 없을 때 대신 보이는 글자 동그라미 */
    .대체사진 {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin: 0 auto;
      background: var(--강조);
      color: #ffffff;
      font-size: 60px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }

    .이름 {
      font-size: 30px;
      margin: 20px 0 6px;
    }

    .소개 {
      font-size: 20px;
      color: var(--보조글자);
      margin: 0 0 36px;
    }

    /* ---------- 기능 2. 링크 버튼 목록 ---------- */
    .링크버튼 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 68px;          /* 손가락으로 누르기 쉬운 큰 버튼 */
      margin-bottom: 16px;
      padding: 14px 20px;
      background: var(--버튼);
      color: var(--글자);
      border: 2px solid var(--버튼테두리);
      border-radius: 16px;
      font-size: 22px;
      font-weight: bold;
      text-decoration: none;     /* 밑줄 없애기 */
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    /* 기능 4. 마우스를 올리거나 누르면 살짝 색이 변함 */
    .링크버튼:hover,
    .링크버튼:active,
    .링크버튼:focus-visible {
      background: var(--강조);
      border-color: var(--강조);
      color: #ffffff;
    }

    .아이콘 { font-size: 24px; }
  </style>
</head>
<body>
  <main class="내용">
    <!-- 프로필 영역 (사진 + 이름 + 소개) -->
    <div id="사진자리"></div>
    <h1 class="이름" id="이름"></h1>
    <p class="소개" id="소개"></p>

    <!-- 링크 버튼들이 여기에 자동으로 만들어집니다 -->
    <nav id="버튼자리"></nav>
  </main>

  <script>
    // 맨 위에 적어둔 정보를 화면에 채워 넣는 부분 (고칠 필요 없음)
    document.getElementById("이름").textContent = 프로필.이름;
    document.getElementById("소개").textContent = 프로필.소개;

    // 프로필 사진: 사진 파일이 없으면 이름 첫 글자 동그라미로 대신 보여줌
    var 사진자리 = document.getElementById("사진자리");
    var 사진 = document.createElement("img");
    사진.className = "프로필사진";
    사진.alt = 프로필.이름 + " 프로필 사진";
    사진.src = 프로필.사진;
    사진.onerror = function () {
      var 대체 = document.createElement("div");
      대체.className = "대체사진";
      대체.textContent = 프로필.이름.charAt(0);
      사진자리.replaceChildren(대체);
    };
    사진자리.appendChild(사진);

    // 링크 버튼 만들기 (누르면 새 탭으로 열림)
    var 버튼자리 = document.getElementById("버튼자리");
    링크목록.forEach(function (링크) {
      var 버튼 = document.createElement("a");
      버튼.className = "링크버튼";
      버튼.href = 링크.주소;
      버튼.target = "_blank";
      버튼.rel = "noopener";
      버튼.innerHTML = '<span class="아이콘"></span><span></span>';
      버튼.children[0].textContent = 링크.아이콘;
      버튼.children[1].textContent = 링크.이름;
      버튼자리.appendChild(버튼);
    });
  </script>
</body>
</html>
